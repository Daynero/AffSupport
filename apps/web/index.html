  <head>

    <meta name="theme-color" content="#3d217f" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Soty" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:title" content="Soty — Твій помічник у медіабаїнгу" />
    <meta property="og:description" content="Твій помічник у медіабаїнгу." />
    <meta property="og:url" content="%SITE_ORIGIN%" />
    <meta property="og:image" content="%SITE_ORIGIN%/soty-share-preview-v2.png" />
    <meta property="og:image:type" content="image/png" />

    <meta property="og:image:alt" content="Soty" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Soty — Твій помічник у медіабаїнгу" />
    <meta name="twitter:description" content="Твій помічник у медіабаїнгу." />
    <meta name="twitter:image" content="%SITE_ORIGIN%/soty-share-preview-v2.png" />
    <meta name="twitter:image:alt" content="Soty" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          if (theme === 'dark') {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#120e1f');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Boot recovery: what the user sees if the bundle never hydrates.
      //
      // Built with DOM calls rather than an innerHTML string, because a content
      // policy hash covers the script's text and nothing it writes: an inline
      // `onclick` and `style="..."` attribute are separately inline, separately
      // blocked, and would have turned the page that exists to survive a
      // failure into a second failure. Assigning through `element.style` is not
      // an inline style attribute and stays allowed.
      //
      // The colours follow the theme the bootstrap above already chose, and the
      // text follows the browser's language, because this screen used to be
      // dark-only and Ukrainian-only regardless of either (FR-057).
      (function () {
        var recoveryKey = 'soty.boot-recovery.v1';
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) {
            try {
              sessionStorage.removeItem(recoveryKey);
            } catch (e) {}
            return;
          }

          try {
            if (!sessionStorage.getItem(recoveryKey)) {
              sessionStorage.setItem(recoveryKey, '1');
              var url = new URL(window.location.href);
              url.searchParams.set('boot-recovery', Date.now().toString(36));
              window.location.replace(url.toString());
              return;
            }
          } catch (e) {}

          var dark = document.documentElement.dataset.theme === 'dark';
          var uk = (navigator.language || '').toLowerCase().indexOf('uk') === 0;
          var text = uk
            ? {
                title: 'Soty не вдалося запустити',
                body: 'Оновіть сторінку, щоб завантажити актуальну версію.',
                action: 'Оновити сторінку'
              }
            : {
                title: 'Soty could not start',
                body: 'Reload the page to fetch the current version.',
                action: 'Reload the page'
              };

          var main = document.createElement('main');
          main.style.minHeight = '100vh';
          main.style.display = 'grid';
          main.style.placeItems = 'center';
          main.style.padding = '24px';
          main.style.textAlign = 'center';
          main.style.font = '16px/1.5 system-ui, sans-serif';
          main.style.background = dark ? '#120e1f' : '#ffffff';
          main.style.color = dark ? '#ffffff' : '#1b102d';

          var box = document.createElement('div');
          var heading = document.createElement('h1');
          heading.textContent = text.title;
          heading.style.margin = '0 0 12px';
          heading.style.fontSize = '28px';

          var body = document.createElement('p');
          body.textContent = text.body;
          body.style.margin = '0 0 20px';
          body.style.color = dark ? '#c9c2dc' : '#4a4458';

          var button = document.createElement('button');
          button.type = 'button';
          button.textContent = text.action;
          button.style.minHeight = '44px';
          button.style.padding = '0 18px';
          button.style.border = '0';
          button.style.borderRadius = '9px';
          button.style.background = '#f5a623';
          button.style.color = '#1b102d';
          button.style.font = 'inherit';
          button.style.fontWeight = '700';
          button.style.cursor = 'pointer';
          button.addEventListener('click', function () {
            location.reload();
          });

          box.appendChild(heading);
          box.appendChild(body);
          box.appendChild(button);
          main.appendChild(box);
          root.appendChild(main);
        }, 3500);
      })();
    </script>
  </body>
</html>
