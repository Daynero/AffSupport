# The verification workflow.
#
# Every job here is the same command with a different phase group, because the
# thing being protected is that CI and a laptop run *the same* checks. A job
# that spelled out its own steps would drift from `npm run verify` the first
# time someone added a gate, and the drift would be invisible until a release.
#
# The Node version is read from `.nvmrc` rather than pinned here. Three
# workflows previously pinned literals, two of which disagreed with the version
# file and with each other; a test now fails any workflow that pins one.
name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/verify-all.mjs --form=fast --gates=static

  test-macos:
    name: test-macos
    runs-on: macos-latest
    # Leave time after the suite's own 30-minute deadline to upload diagnosis.
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install media test dependencies
        run: brew install ffmpeg
      - run: node scripts/verify-all.mjs --form=fast --gates=suite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-result-macos
          path: |
            verification-result.json
            verification-progress.log
          if-no-files-found: ignore

  coverage-macos:
    name: coverage-macos
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: brew install ffmpeg
      - run: node scripts/verify-all.mjs --form=release --gates=suite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-coverage-macos
          path: |
            verification-result.json
            verification-progress.log
          if-no-files-found: ignore

  test-windows:
    name: test-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install media test dependencies
        run: choco install ffmpeg --yes --no-progress
      - name: Diagnose native tar Unicode locale
        shell: pwsh
        run: |
          @'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const root = fs.mkdtempSync(path.join(os.tmpdir(), 'soty-tar-locale-'));
          fs.mkdirSync(path.join(root, 'payload'));
          fs.writeFileSync(path.join(root, 'payload', '\u0432\u0456\u0434\u0435\u043e.txt'), 'unicode');
          const tar = path.join(process.env.SystemRoot, 'System32', 'tar.exe');
          for (const locale of ['', 'C.UTF-8', 'en_US.UTF-8', '.UTF-8']) {
            const env = { ...process.env, ...(locale ? { LANG: locale, LC_ALL: locale } : {}) };
            const archive = path.join(root, 'test.tar.gz');
            const created = spawnSync(tar, ['-czf', archive, '-C', root, 'payload'], { env, encoding: 'utf8' });
            const listed = created.status === 0 ? spawnSync(tar, ['-tzf', archive], { env, encoding: 'utf8' }) : null;
            console.log(JSON.stringify({locale, created: created.status, stderr: created.stderr, listed: listed?.status, names: listed?.stdout}));
          }
          fs.rmSync(root, {recursive: true, force: true, maxRetries: 8, retryDelay: 40});
          '@ | node --input-type=module
      - name: Diagnose native archive and release policy failures
        run: |
          npm run build -w @video-compressor/shared
          npx vitest run tests/windows-archive.test.ts tests/web-only-policy.test.ts --maxWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile.json=windows-targeted.json
      # The whole suite, not a hand-maintained list of files. Tests that cannot
      # run here are named skips, and an unexplained skip fails the run.
      - run: node scripts/verify-all.mjs --form=fast --gates=suite

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-result-windows
          path: |
            verification-result.json
            verification-suite.json
            verification-progress.log
            windows-targeted.json
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/verify-all.mjs --form=release --gates=build

  e2e:
    name: e2e
    # The single biggest minutes lever: this harness needs a full build and real
    # binaries, and its failures are rarely local to one change. So it runs on
    # the default branch and on pull requests that ask for it by label, rather
    # than on every push.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e')
    # GitHub's Linux runners provide Docker for the local Supabase database.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local database
        run: |
          npm run build -w @video-compressor/shared
          npx supabase start
      - name: Install browser test dependencies
        run: npx playwright-core install --with-deps chromium
      - run: node scripts/verify-all.mjs --form=release --gates=e2e
      - name: Stop local database
        if: always()
        run: npx supabase stop
