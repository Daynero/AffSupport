# 052 delivery Worker: serves the signed pool aliases /g/* on the media origin and
# fetches the canonical /g1/<image> object, which bypasses this Worker.
# CATALOG_GLOBAL_ALIAS_KEYS is a Worker secret (wrangler secret put); it must equal
# the Supabase secret of the same name. Never commit or print it.
name = "soty-catalog-image-delivery"
main = "dist/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [{ pattern = "catalog-images.soty.pp.ua/g/*", zone_name = "soty.pp.ua" }]

[vars]
CATALOG_IMAGES_ENVIRONMENT = "production"
R2_CATALOG_PUBLIC_ORIGIN = "https://catalog-images.soty.pp.ua"
CATALOG_GLOBAL_ROUTING_REVISION = "r1"
CATALOG_GLOBAL_DELIVERY_CONFIRMATION = "production:https://catalog-images.soty.pp.ua:r1:1"
# 057 space-read (src/space-read.ts): private R2 space files on their own host. The route
# `files[-beta].soty.pp.ua/*` and the bucket are provisioned by T002/T062; until then the
# route stays out of `routes` above and nothing here is deployed. SPACE_READ_GRANT_KEYS
# (equal to the Supabase secret of the same name) and SUPABASE_SERVICE_ROLE_KEY are Worker
# secrets (wrangler secret put); SUPABASE_URL comes with them. Without them the files host
# answers 503 and the /g/* alias path keeps working.
SPACE_FILES_HOST = "files.soty.pp.ua"
SPACE_ALLOWED_ORIGINS = "https://soty.pp.ua,https://next.soty.pp.ua"

# The SPACE_BUCKET binding is switched on in T062, once soty-spaces-production exists.
# wrangler refuses to deploy a binding to a missing bucket, and this Worker also serves the
# live catalog image aliases, so an early binding would block their deploys (next-quick).
# [[r2_buckets]]
# binding = "SPACE_BUCKET"
# bucket_name = "soty-spaces-production"

# 057 T002: the beta files host, a separate Worker (`soty-catalog-image-delivery-beta`,
# `wrangler deploy --env beta`). Nothing above is inherited for vars or bindings, and the
# production section stays as it is: its SPACE_BUCKET binding waits for T062. This Worker
# serves only `files-beta.soty.pp.ua`; it has no /g/* route, so the catalog alias vars of
# the production Worker are not needed here. Not deployed yet — the Cloudflare-side steps
# (DNS record, route, secrets) need the owner's authorization, see docs/PRODUCTION.md
# «Space files host (057)».
#
# Secrets (`wrangler secret put <NAME> --env beta`, never committed or printed):
#   SPACE_READ_GRANT_KEYS     — equal to the beta space-storage secret of the same name;
#   SUPABASE_SERVICE_ROLE_KEY — of the beta Supabase whose `service_space_read_epoch` it reads.
# SUPABASE_URL must be a public HTTPS address of that beta API (index.ts refuses http outside
# `dev`); the local beta stack listens on 127.0.0.1:54321 only, so it is set with the secrets
# once a reachable address exists (docs/PRODUCTION.md).
[env.beta]
workers_dev = false
routes = [{ pattern = "files-beta.soty.pp.ua/*", zone_name = "soty.pp.ua" }]

[env.beta.vars]
CATALOG_IMAGES_ENVIRONMENT = "beta"
SPACE_FILES_HOST = "files-beta.soty.pp.ua"
SPACE_ALLOWED_ORIGINS = "https://next.soty.pp.ua,https://soty.pp.ua,http://localhost:5173,http://127.0.0.1:5173"

[[env.beta.r2_buckets]]
binding = "SPACE_BUCKET"
bucket_name = "soty-spaces-beta"
