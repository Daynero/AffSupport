project_id = "wishly"

[db]
major_version = 17

[auth]
site_url = "http://127.0.0.1:5173"
# The beta staging environment signs in for real against this local stack, so
# its loopback origins must be allowlisted here: the CLI reads redirect URLs
# only from this file. These are local-only addresses and never reach the
# hosted project, which is why scripts/verify-release.mjs deliberately excludes
# this file from its beta-marker scan (see docs/BETA.md).
additional_redirect_urls = [
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:5175",
  "http://127.0.0.1:5175/auth/callback",
  "http://127.0.0.1:43140",
  "http://127.0.0.1:43140/auth/callback"
]

[functions.delete-account]
verify_jwt = true

[functions.team-invitations]
verify_jwt = true

[functions.drive-connect]
verify_jwt = true

[functions.drive-oauth-callback]
verify_jwt = false

[functions.catalog-sync]
verify_jwt = false

[functions.drive-transfer]
verify_jwt = false

[functions.preview-warm]
verify_jwt = false

[functions.drive-ops]
verify_jwt = false

[functions.library-ops]
verify_jwt = false
